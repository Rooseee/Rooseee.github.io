<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <button class="brand" id="home-btn" type="button">Rose</button>
  <div class="hnav">
    <div class="tabs" role="tablist" aria-label="Style de rendu" id="tabs"></div>
    <button class="hgames" id="header-games" type="button">Jeux</button>
  </div>
</header>

<main id="stage" aria-label="Rose en rotation. Glisser pour la faire tourner.">
  <pre id="ascii" role="img" aria-label="Rose en art ASCII, en rotation"></pre>
  <canvas id="cv" role="img" aria-label="Rose en rotation"></canvas>
</main>


<div id="intro">
  <div class="hp-top"><span class="hp-brand">Rose</span><span class="by">by Guigui</span></div>
  <div class="hp-bottom">
    <div class="hp-ticks" aria-label="Styles de la rose"></div>
    <div class="hp-btns">
      <button id="go" class="hbtn primary" type="button">Accède à ta Rose</button>
      <button id="games-btn" class="hbtn" type="button">Accéder aux jeux</button>
    </div>
  </div>
</div>

<div id="games" hidden role="dialog" aria-label="Les jeux">
  <div class="gbar"><button class="gback" id="gback" type="button">← Accueil</button><h3 id="gtitle">Jeux</h3></div>
  <div id="gbody"></div>
</div>

<script src="js/core.js"></script>
<script src="js/app.js"></script>
<script src="js/games.js"></script>
</body>
</html>

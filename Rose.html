<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rose</title>
<style>
:root{
  --bg:#0b0a0a; --ink:#e9e4e2; --dim:#7d7476; --line:rgba(255,255,255,.13);
  --accent:rgb(255,92,150);
  --mono:ui-monospace,"SF Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:13px; display:flex; flex-direction:column; overflow:hidden; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
header{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:10px 24px; padding:18px 24px 0}
.brand{font-size:15px; font-weight:700; background:none; border:0; padding:0; cursor:pointer}
.brand:hover{color:var(--accent)}
.hnav{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 28px}
.hgames{font-size:13px; background:none; border:0; border-left:1px solid var(--line); padding:2px 0 2px 28px; color:var(--ink); cursor:pointer}
.hgames:hover{color:var(--accent)}
.tabs{display:flex; flex-wrap:wrap; gap:4px 22px}
.tabs button{font-size:13px; color:var(--dim); background:none; border:0; border-bottom:1px solid transparent; padding:2px 0; cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
button:focus-visible{outline:2px solid var(--ink); outline-offset:3px}

#stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; margin:8px 12px 12px; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#stage.drag{cursor:grabbing}
#ascii{font-family:var(--mono); line-height:1; letter-spacing:0; white-space:pre; font-variant-ligatures:none; color:var(--accent); pointer-events:none; display:none}
#cv{display:none; pointer-events:none}

/* accueil */
#intro{position:fixed; left:0; top:0; bottom:0; width:min(380px,42vw); z-index:10; display:flex; flex-direction:column; justify-content:space-between; padding:18px 24px 26px; background:var(--bg); border-right:1px solid var(--line); transition:transform .5s ease, visibility .5s}
#intro.gone{transform:translateX(-100%); visibility:hidden}
.hp-top{font-size:15px; font-weight:700}
.hp-nav{border-top:1px solid var(--line)}
.hp-nav button{display:flex; justify-content:space-between; align-items:baseline; width:100%; padding:18px 0; font-size:15px; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); cursor:pointer}
.hp-nav button i{font-style:normal; color:var(--dim); transition:transform .2s, color .2s}
.hp-nav button:hover{color:var(--accent)}
.hp-nav button:hover i{color:var(--accent); transform:translateX(4px)}
.by{color:var(--dim); font-size:12px}
body.home header{visibility:hidden}
body.home #stage{margin-left:min(380px,42vw)}
@media (max-width:700px){
  #intro{top:auto; width:100%; border-right:0; border-top:1px solid var(--line); padding:10px 20px 18px; gap:6px}
  #intro.gone{transform:translateY(100%)}
  .hp-top{display:none}
  .hp-nav button{padding:14px 0}
  body.home #stage{margin:8px 12px 190px}
  .hnav{gap:6px 18px} .hgames{padding-left:18px}
}

/* jeux */
#games{position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; overflow:auto; background:var(--bg)}
#games[hidden]{display:none}
.gbar{display:flex; align-items:baseline; gap:22px; padding:18px 24px}
.gbar h3{font-size:15px; font-weight:700}
.gback{background:none; border:0; padding:0; color:var(--dim); cursor:pointer}
.gback:hover{color:var(--ink)}
#gbody{flex:1; display:flex; justify-content:center; padding:10px 16px 28px}
.gmenu{display:flex; flex-direction:column; width:min(520px,100%); border-top:1px solid var(--line); align-self:flex-start; margin-top:6px}
.gcard{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:18px 2px; font-size:15px; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); cursor:pointer}
.gcard:hover{color:var(--accent)}
.gcard em{font-style:normal; color:var(--dim); font-size:12px}
.g-col{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%}
.g-stats{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 20px; color:var(--dim); font-size:12px}
.g-msg{min-height:20px; font-size:14px; text-align:center}
.g-msg.big{color:var(--accent)}
.gbtn{font-size:13px; background:none; border:1px solid var(--line); border-radius:2px; padding:9px 16px; cursor:pointer}
.gbtn:hover{border-color:var(--accent); color:var(--accent)}
.gc{width:min(92vw,420px,calc((100vh - 190px) * .692)); height:auto; aspect-ratio:360/520; border:1px solid var(--line); touch-action:none; cursor:pointer; background:#0d0b0b}
.gc.sq{aspect-ratio:1; width:min(92vw,440px,calc(100vh - 190px))}
.pf{width:min(86vw,440px,calc(100vh - 210px)); height:auto; overflow:visible; cursor:pointer}
.fall{transition:transform 1.1s cubic-bezier(.4,0,.8,.6), opacity 1.1s ease-in; transform-box:view-box; transform-origin:0 0}
.fall:hover ellipse{filter:brightness(1.12)}
.mgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; width:min(92vw,420px)}
.mc{aspect-ratio:1; padding:0; border:0; background:none; cursor:pointer; perspective:600px}
.mi{display:block; position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .4s}
.mc.flip .mi{transform:rotateY(180deg)}
.mf,.mk{position:absolute; inset:0; border-radius:3px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; align-items:center; justify-content:center}
.mk{background:#161111; border:1px solid var(--line)}
.mc:hover .mk{border-color:rgba(255,255,255,.3)}
.mf{transform:rotateY(180deg); background:#161111; border:1px solid var(--line); padding:8px}
.mf svg{width:100%; height:100%}
.mc.ok .mf{border-color:var(--accent)}

.seg{display:flex; gap:20px; font-size:12px}
.seg button{background:none; border:0; border-bottom:1px solid transparent; color:var(--dim); padding:2px 0; cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.irow{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
.ttg{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; width:min(86vw,320px)}
.tc{aspect-ratio:1; background:#121010; border:1px solid var(--line); border-radius:2px; font-size:min(14vw,56px); font-weight:700; line-height:1; cursor:pointer; color:var(--ink); padding:0}
.tc:hover{border-color:rgba(255,255,255,.3)}
.tc.x{color:var(--accent)}
.tc.win{border-color:var(--accent)}
.c4{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; width:min(94vw,420px); padding:8px; background:#121010; border:1px solid var(--line)}
.cc{aspect-ratio:1; border-radius:50%; background:#0b0a0a; border:1px solid var(--line); cursor:pointer; padding:0}
.cc.p1{background:var(--accent); border-color:var(--accent)}
.cc.p2{background:#e9e4e2; border-color:#e9e4e2}
.cc.win{box-shadow:0 0 0 2px #121010, 0 0 0 3px var(--ink)}
.mg{display:grid; grid-template-columns:repeat(9,1fr); gap:2px; width:min(94vw,360px); user-select:none; -webkit-user-select:none; touch-action:manipulation}
.mcell{aspect-ratio:1; background:#1d1818; border:0; border-radius:1px; font-weight:700; font-size:15px; cursor:pointer; color:var(--ink); padding:0}
.mcell:hover:not(.o){background:#2a2222}
.mcell.o{background:#0f0d0d; cursor:default}
.mcell.f{color:var(--accent)}
.mcell.b{background:var(--accent); color:#16060d}

.gn{display:flex; align-items:center; gap:12px}
.gn svg{width:20px; height:20px; flex:none}
.tc{display:flex; align-items:center; justify-content:center}
.tc svg{width:64%; height:64%}
.cc svg{width:100%; height:100%; display:block}
.cc.p1,.cc.p2{background:none; border-color:transparent}
.mcell svg{width:70%; height:70%; display:block; margin:auto}
.simon{display:grid; grid-template-columns:1fr 1fr; gap:10px; width:min(80vw,320px)}
.sm{aspect-ratio:1; background:#121010; border:1px solid var(--line); border-radius:3px; padding:16px; cursor:pointer}
.sm svg{width:100%; height:100%; display:block; opacity:.38; transition:opacity .12s, transform .12s}
.sm.lit svg{opacity:1; transform:scale(1.07)}
.sm.lit{border-color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<header>
  <button class="brand" id="home-btn" type="button">Rose</button>
  <div class="hnav">
    <div class="tabs" role="tablist" aria-label="Style de rendu" id="tabs"></div>
    <button class="hgames" id="header-games" type="button">Jeux</button>
  </div>
</header>

<main id="stage" aria-label="Rose en rotation. Glisser pour la faire tourner.">
  <pre id="ascii" role="img" aria-label="Rose en art ASCII, en rotation"></pre>
  <canvas id="cv" role="img" aria-label="Rose en rotation"></canvas>
</main>


<nav id="intro" aria-label="Accueil">
  <div class="hp-top">Rose</div>
  <div class="hp-nav">
    <button id="go" type="button"><span>Accède à ta Rose</span><i>→</i></button>
    <button id="games-btn" type="button"><span>Accéder aux jeux</span><i>→</i></button>
  </div>
  <div class="by">by Guigui</div>
</nav>

<div id="games" hidden role="dialog" aria-label="Les jeux">
  <div class="gbar"><button class="gback" id="gback" type="button">← Accueil</button><h3 id="gtitle">Jeux</h3></div>
  <div id="gbody"></div>
</div>

<script>
/* ===== Rosa — cœur 3D (pur, sans DOM) ===== */
var TAU = Math.PI * 2;

/* Surface paramétrique d'une rose : u∈[0,1] (base→bord du pétale), v∈[0,20π] (enroulement) */
function roseSurface(u, v) {
  var phi = (Math.PI / 2) * Math.exp(-v / (8 * Math.PI));
  var m = (3.6 * v) % TAU;
  var q = 1.25 * Math.pow(1 - m / Math.PI, 2) - 0.25;
  var P = 1 - 0.5 * q * q;
  var y = 1.95653 * u * u * Math.pow(1.27689 * u - 1, 2) * Math.sin(phi);
  var r = P * (u * Math.sin(phi) + y * Math.cos(phi));
  return [r * Math.sin(v), r * Math.cos(v), P * (u * Math.cos(phi) - y * Math.sin(phi))];
}

var STEM_LEN = 1.6;
function stemCenter(s) { return [0.09 * Math.sin(s * 2.6), 0, -0.22 - s * STEM_LEN]; }
function stemSurface(s, a) {
  var c = stemCenter(s), r = 0.045 + 0.012 * (1 - s);
  return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a), c[2]];
}
/* coupe (calice) sous la fleur */
function cupSurface(s, a) {
  var r = 0.045 + 0.15 * Math.pow(1 - s, 1.4);
  return [r * Math.cos(a), r * Math.sin(a), -0.24 * s + 0.05];
}
function leafSurface(psi, s0) {
  var base = stemCenter(s0);
  var dx = Math.cos(psi), dy = Math.sin(psi);
  return function (s, t) {
    var w = 0.17 * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.75)), 0.9);
    var L = s * 1.0;
    var fold = 0.45 * Math.abs(t) * w;
    return [
      base[0] + dx * L * 0.95 - dy * t * w,
      base[1] + dy * L * 0.95 + dx * t * w,
      base[2] + L * 0.38 - 0.30 * s * s + fold
    ];
  };
}

function buildPart(f, nu, nv, u0, u1, v0, v1, kind, tagFn, ringStep, lineStep, off, eu, ev) {
  var n = nu * nv;
  var pos = new Float32Array(n * 3), nrm = new Float32Array(n * 3);
  var tag = new Float32Array(n), kd = new Uint8Array(n), sz = new Float32Array(n);
  var k = 0, du = (u1 - u0) / (nu - 1), dv = (v1 - v0) / (nv - 1);
  for (var iu = 0; iu < nu; iu++) {
    var u = u0 + (u1 - u0) * iu / (nu - 1);
    for (var iv = 0; iv < nv; iv++) {
      var v = v0 + (v1 - v0) * iv / (nv - 1);
      var p = f(u, v);
      var a1 = f(u + eu, v), a0 = f(u - eu, v), b1 = f(u, v + ev), b0 = f(u, v - ev);
      var ax = a1[0] - a0[0], ay = a1[1] - a0[1], az = a1[2] - a0[2];
      var bx = b1[0] - b0[0], by = b1[1] - b0[1], bz = b1[2] - b0[2];
      var nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
      var l = Math.sqrt(nx * nx + ny * ny + nz * nz);
      if (l < 1e-12) { nx = 0; ny = 0; nz = 1; l = 1; }
      pos[3 * k] = p[0]; pos[3 * k + 1] = p[1]; pos[3 * k + 2] = p[2];
      nrm[3 * k] = nx / l; nrm[3 * k + 1] = ny / l; nrm[3 * k + 2] = nz / l;
      var su = Math.sqrt(ax * ax + ay * ay + az * az) / (2 * eu) * du, sv = Math.sqrt(bx * bx + by * by + bz * bz) / (2 * ev) * dv;
      sz[k] = su > sv ? su : sv;
      tag[k] = tagFn ? tagFn(u, v) : 1;
      kd[k] = kind;
      k++;
    }
  }
  return { n: n, pos: pos, nrm: nrm, tag: tag, kind: kd, sz: sz,
           meta: { off: off, nu: nu, nv: nv, kind: kind, ringStep: ringStep, lineStep: lineStep } };
}

function buildRoseMesh(densU, nvPetal) {
  var density = densU || 1;
  var parts = [];
  parts.push(buildPart(roseSurface, Math.round(64 * density), nvPetal || 2400, 0, 1, 0, 20 * Math.PI, 0,
    function (u) { return u; }, Math.max(1, Math.round(7 * density)), 48, 0, 0.002, 0.006));
  parts.push(buildPart(stemSurface, 70, 20, 0, 1, 0, TAU, 1, null, 6, 3, 0, 0.002, 0.01));
  parts.push(buildPart(cupSurface, 16, 24, 0, 1, 0, TAU, 1, null, 5, 4, 0, 0.002, 0.01));
  parts.push(buildPart(leafSurface(0.7, 0.42), 46, 28, 0, 1, -1, 1, 2, null, 5, 2, 0, 0.002, 0.01));
  parts.push(buildPart(leafSurface(0.7 + Math.PI * 1.05, 0.72), 46, 28, 0, 1, -1, 1, 2, null, 5, 2, 0, 0.002, 0.01));
  var n = 0, i;
  for (i = 0; i < parts.length; i++) { parts[i].meta.off = n; n += parts[i].n; }
  var pos = new Float32Array(n * 3), nrm = new Float32Array(n * 3), tag = new Float32Array(n), kind = new Uint8Array(n), sz = new Float32Array(n);
  var o = 0;
  for (i = 0; i < parts.length; i++) {
    pos.set(parts[i].pos, o * 3); nrm.set(parts[i].nrm, o * 3); tag.set(parts[i].tag, o); kind.set(parts[i].kind, o); sz.set(parts[i].sz, o);
    o += parts[i].n;
  }
  var zmin = 1e9, zmax = -1e9;
  for (i = 0; i < n; i++) { var z = pos[3 * i + 2]; if (z < zmin) zmin = z; if (z > zmax) zmax = z; }
  var zc = (zmin + zmax) / 2, R0 = 0;
  for (i = 0; i < n; i++) {
    var x = pos[3 * i], y = pos[3 * i + 1], zz = pos[3 * i + 2] - zc;
    var d = Math.sqrt(x * x + y * y + zz * zz); if (d > R0) R0 = d;
  }
  return { n: n, pos: pos, nrm: nrm, tag: tag, kind: kind, sz: sz, parts: parts.map(function (p) { return p.meta; }), zc: zc, R0: R0, zmin: zmin, zmax: zmax };
}

/* ===== Rastérisation (z-buffer) ===== */
var LIGHT = (function () { var l = [-0.5, 0.6, 0.65], n = Math.hypot(l[0], l[1], l[2]); return [l[0] / n, l[1] / n, l[2] / n]; })();
var HALF = (function () { var h = [LIGHT[0], LIGHT[1], LIGHT[2] + 1], n = Math.hypot(h[0], h[1], h[2]); return [h[0] / n, h[1] / n, h[2] / n]; })();

function makeFrame(W, H) {
  var n = W * H;
  return { W: W, H: H, z: new Float32Array(n), kd: new Uint8Array(n), dif: new Float32Array(n),
           ndv: new Float32Array(n), hh: new Float32Array(n), ao: new Float32Array(n) };
}

/* p: {spin,tilt,scaleX,scaleY,cx,cy,splat} — kd = kind+1 (0 = vide) */
function rasterize(mesh, fr, p) {
  var W = fr.W, H = fr.H, z = fr.z, kd = fr.kd, dif = fr.dif, ndv = fr.ndv, hh = fr.hh, ao = fr.ao;
  z.fill(-1e9); kd.fill(0);
  var cs = Math.cos(p.spin), sn = Math.sin(p.spin), ca = Math.cos(p.tilt), sa = Math.sin(p.tilt);
  var pos = mesh.pos, nrm = mesh.nrm, tag = mesh.tag, kind = mesh.kind, szs = mesh.sz, n = mesh.n, zc = mesh.zc;
  var sX = p.scaleX, sY = p.scaleY, cx = p.cx, cy = p.cy, sp0 = p.splat || 1, maxSp = p.maxSplat || sp0, sp = sp0;
  var L0 = LIGHT[0], L1 = LIGHT[1], L2 = LIGHT[2], H0 = HALF[0], H1 = HALF[1], H2 = HALF[2];
  var off = 0;
  for (var i = 0; i < n; i++) {
    sp = sp0;
    if (maxSp > sp0) { sp = Math.ceil(szs[i] * sY * 0.95); if (sp < sp0) sp = sp0; else if (sp > maxSp) sp = maxSp; }
    off = 0.5 - sp / 2;
    var x = pos[3 * i], y = pos[3 * i + 1], zz = pos[3 * i + 2] - zc;
    var xr = x * cs - y * sn, yr = x * sn + y * cs;
    var sy = yr * sa + zz * ca, dp = -yr * ca + zz * sa;
    var px = cx + xr * sX, py = cy - sy * sY;
    var ix0 = Math.floor(px + off), iy0 = Math.floor(py + off);
    if (ix0 + sp <= 0 || iy0 + sp <= 0 || ix0 >= W || iy0 >= H) continue;
    var nx = nrm[3 * i], ny = nrm[3 * i + 1], nz = nrm[3 * i + 2];
    var nxr = nx * cs - ny * sn, nyr = nx * sn + ny * cs;
    var nU = nyr * sa + nz * ca, nT = -nyr * ca + nz * sa;
    var d = nxr * L0 + nU * L1 + nT * L2; if (d < 0) d = -d;
    var vv = nT < 0 ? -nT : nT;
    var h = nxr * H0 + nU * H1 + nT * H2; if (h < 0) h = -h;
    var k = kind[i] + 1, a = tag[i];
    for (var dy = 0; dy < sp; dy++) {
      var yy = iy0 + dy; if (yy < 0 || yy >= H) continue;
      for (var dx = 0; dx < sp; dx++) {
        var xx = ix0 + dx; if (xx < 0 || xx >= W) continue;
        var j = yy * W + xx;
        if (dp > z[j]) { z[j] = dp; kd[j] = k; dif[j] = d; ndv[j] = vv; hh[j] = h; ao[j] = a; }
      }
    }
  }
}

/* luminance 0..1 pour les rendus texte */
function lumOf(d, v, a) {
  var b = d * (0.3 + 0.7 * a);
  var l = 0.07 + 0.78 * Math.pow(b, 1.15) + 0.28 * Math.pow(1 - v, 2.5);
  return l < 0.06 ? 0.06 : (l > 1 ? 1 : l);
}

/* >1 normal ; <1 : pixel masqué par un voisin plus proche (arête entre pétales) */
function edgeFactor(fr, x, y, thr) {
  var W = fr.W, H = fr.H, z = fr.z, i = y * W + x, zi = z[i] + thr;
  if ((x > 0 && z[i - 1] > zi) || (x < W - 1 && z[i + 1] > zi) || (y > 0 && z[i - W] > zi) || (y < H - 1 && z[i + W] > zi)) return 0.42;
  return 1;
}

/* couleur d'un pixel (rendu réaliste) → [r,g,b] 0..255 */
function shadeReal(k, d, v, h, a, base) {
  var rim = Math.pow(1 - v, 2.5), r, g, b;
  if (k === 1) {
    var m = 0.32 + 0.68 * Math.pow(a, 0.8), lit = 0.22 + 0.95 * d;
    var sp = Math.pow(h, 24) * 0.32;
    r = base[0] * m * lit + (base[0] * 0.5 + 110) * rim * 0.32 + 255 * sp;
    g = base[1] * m * lit + (base[1] * 0.5 + 110) * rim * 0.32 + 255 * sp;
    b = base[2] * m * lit + (base[2] * 0.5 + 110) * rim * 0.32 + 255 * sp;
  } else {
    var gb = k === 3 ? [70, 170, 80] : [48, 120, 62], lt = 0.25 + 0.95 * d, sp2 = Math.pow(h, 30) * 0.25;
    r = gb[0] * lt + 255 * sp2 + 25 * rim; g = gb[1] * lt + 255 * sp2 + 40 * rim; b = gb[2] * lt + 255 * sp2 + 20 * rim;
  }
  return [r > 255 ? 255 : r, g > 255 ? 255 : g, b > 255 ? 255 : b];
}

if (typeof module !== 'undefined') module.exports = { edgeFactor: edgeFactor, buildRoseMesh: buildRoseMesh, makeFrame: makeFrame, rasterize: rasterize, lumOf: lumOf, shadeReal: shadeReal };


(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), pre = $('ascii'), cv = $('cv'), ctx = cv.getContext('2d');

  /* ---------- données ---------- */
  var MODES = [
    { id: 'ascii',   label: 'Lettres' },
    { id: 'asciic',  label: 'Lettres couleur' },
    { id: 'braille', label: 'Pointillé' },
    { id: 'real',    label: 'Réaliste' },
    { id: 'neon',    label: 'Lumineux' }
  ];
  var PALETTES = [
    { name: 'Rouge',  rgb: [205, 18, 48] },
    { name: 'Rose',   rgb: [255, 92, 150] },

    }
    grid.addEventListener('click', function (e) {
      var cell = e.target.closest('.cc'); if (!cell || over || busy) return;
      var c = +cell.dataset.c; if (bd[c].length >= ROWS) return;
      play(c);
      if (!over && mode === 'ai') {
        busy = true; msg.textContent = '…';
        timers.push(setTimeout(function () { busy = false; if (!over) play(aiMove()); }, 350));
      }
    });
    seg.addEventListener('click', function (e) {
      var m = e.target.dataset && e.target.dataset.m; if (!m || m === mode) return;
      mode = m; sc = [0, 0, 0];
      Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute('aria-pressed', x.dataset.m === m ? 'true' : 'false'); });
      reset();
    });
    w.querySelector('.gbtn').addEventListener('click', reset);
    reset();
    return function () { timers.forEach(clearTimeout); };
  }

  /* ---------- Simon des roses ---------- */
  function gSimon(root) {
    var COLS = [{ c: '#cd1230', f: 262 }, { c: '#ff5c96', f: 330 }, { c: '#ffba32', f: 392 }, { c: '#f4eee4', f: 523 }];
    var w = el('<div class="g-col"><div class="g-stats"><span class="sl">Niveau 0</span><span class="sr"></span></div><div class="simon"></div><div class="g-msg"></div><button class="gbtn" type="button">Commencer</button></div>');
    root.appendChild(w);
    var pad = w.querySelector('.simon'), sl = w.querySelector('.sl'), sr = w.querySelector('.sr'), msg = w.querySelector('.g-msg'), btn = w.querySelector('.gbtn');
    var seq = [], pos = 0, ok = false, timers = [], ac = null;
    COLS.forEach(function (k, i) { var b = el('<button type="button" class="sm" data-i="' + i + '" aria-label="Rose ' + (i + 1) + '">' + roseIcon(k.c) + '</button>'); pad.appendChild(b); });
    function best() { var b = store('simon'); sr.textContent = 'Record : ' + (b ? 'niveau ' + b : '–'); }
    function tone(f, d) {
      try {
        ac = ac || new (window.AudioContext || window.webkitAudioContext)();
        var o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d / 1000);
        o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d / 1000 + 0.05);
      } catch (_) {}
    }
    function light(i, d) {
      var b = pad.children[i]; b.classList.add('lit'); tone(COLS[i].f, d);
      timers.push(setTimeout(function () { b.classList.remove('lit'); }, d));
    }
    function next() {
      seq.push((Math.random() * 4) | 0); pos = 0; ok = false; msg.className = 'g-msg'; msg.textContent = 'Regarde';
      sl.textContent = 'Niveau ' + (seq.length - 1);
      var gap = Math.max(260, 560 - seq.length * 20);
      seq.forEach(function (v, k) { timers.push(setTimeout(function () { light(v, gap - 120); }, 600 + k * gap)); });
      timers.push(setTimeout(function () { ok = true; msg.textContent = 'À toi'; }, 600 + seq.length * gap));
    }
    function start() { timers.forEach(clearTimeout); timers = []; seq = []; btn.textContent = 'Recommencer'; next(); }
    pad.addEventListener('click', function (e) {
      var b = e.target.closest('.sm'); if (!b || !ok) return;
      var i = +b.dataset.i; light(i, 200);
      if (i !== seq[pos]) {
        ok = false; var lvl = seq.length - 1, bs = +store('simon') || 0; if (lvl > bs) store('simon', lvl);
        msg.className = 'g-msg big'; msg.textContent = 'Raté — niveau ' + lvl; best(); return;
      }
      pos++;
      if (pos === seq.length) { ok = false; msg.textContent = 'Bien'; timers.push(setTimeout(next, 800)); }
    });
    btn.addEventListener('click', start);
    best();
    return function () { timers.forEach(clearTimeout); if (ac && ac.close) { try { ac.close(); } catch (_) {} } };
  }

  /* ---------- Démineur ---------- */
  function gMines(root) {
    var N = 9, M = 10;
    var w = el('<div class="g-col"><div class="seg"><button type="button" data-m="dig" aria-pressed="true">Creuser</button><button type="button" data-m="flag" aria-pressed="false">Planter</button></div><div class="g-stats"><span class="ml"></span><span class="mt"></span><span class="mr"></span></div><div class="mg"></div><div class="g-msg"></div><button class="gbtn" type="button">Rejouer</button></div>');
    root.appendChild(w);
    var grid = w.querySelector('.mg'), ml = w.querySelector('.ml'), mt = w.querySelector('.mt'), mr = w.querySelector('.mr'), msg = w.querySelector('.g-msg'), seg = w.querySelector('.seg');
    var cells, started, over, flagMode = false, t0, tmr, lp;
    function best() { var b = store('mines'); mr.textContent = 'Record : ' + (b ? b + ' s' : '–'); }
    function nb(i) { var x = i % N, y = (i / N) | 0, r = []; for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; var a = x + dx, b = y + dy; if (a >= 0 && a < N && b >= 0 && b < N) r.push(b * N + a); } return r; }
    function stop() { if (tmr) { clearInterval(tmr); tmr = null; } }
    function reset() {
      stop(); cells = []; for (var i = 0; i < N * N; i++) cells.push({ m: false, o: false, f: false, n: 0 });
      started = false; over = false; msg.textContent = ''; msg.className = 'g-msg'; mt.textContent = 'Temps : 0 s'; best();
      grid.innerHTML = ''; for (i = 0; i < N * N; i++) { var c = document.createElement('button'); c.type = 'button'; c.className = 'mcell'; c.dataset.i = i; grid.appendChild(c); }
      render();
    }
    function seed(first) {
      var safe = nb(first).concat(first), n = 0;
      while (n < M) { var i = (Math.random() * N * N) | 0; if (cells[i].m || safe.indexOf(i) >= 0) continue; cells[i].m = true; n++; }
      cells.forEach(function (c, i) { c.n = nb(i).filter(function (j) { return cells[j].m; }).length; });
      started = true; t0 = Date.now(); tmr = setInterval(function () { mt.textContent = 'Temps : ' + Math.round((Date.now() - t0) / 1000) + ' s'; }, 500);
    }
    var COL = ['', '#6aa9ff', '#6fd08c', '#ff7a7a', '#b48cff', '#ffba32', '#ffba32', '#ffba32', '#ffba32'];
    function render() {
      var flags = 0;
      Array.prototype.forEach.call(grid.children, function (b, i) {
        var c = cells[i]; if (c.f) flags++;
        b.className = 'mcell' + (c.o ? ' o' : '') + (c.f ? ' f' : '') + (c.boom ? ' b' : '');
        b.style.color = c.o && c.n ? COL[c.n] : '';
        b.innerHTML = c.o ? (c.m ? thornIcon() : (c.n || '')) : (c.f ? roseIcon(PINK) : (over && c.m ? thornIcon() : ''));
      });
      ml.textContent = 'Épines : ' + (M - flags);
    }
    function open(i) {
      var st = [i];
      while (st.length) {
        var k = st.pop(), c = cells[k]; if (c.o || c.f) continue; c.o = true;
        if (c.n === 0 && !c.m) nb(k).forEach(function (j) { if (!cells[j].o) st.push(j); });
      }
    }
    function act(i, flag) {
      if (over) return; var c = cells[i];
      if (flag) { if (!c.o) { c.f = !c.f; render(); } return; }
      if (c.f || c.o) return;
      if (!started) seed(i);
      if (c.m) {
        over = true; stop(); c.boom = true; cells.forEach(function (x) { if (x.m) x.o = true; });
        msg.textContent = 'Piqué'; render(); return;
      }
      open(i);
      if (cells.every(function (x) { return x.m || x.o; })) {
        over = true; stop(); var s = Math.round((Date.now() - t0) / 1000), b = +store('mines'), rec = !b || s < b; if (rec) store('mines', s);
        cells.forEach(function (x) { if (x.m) x.f = true; });
        msg.className = 'g-msg big'; msg.textContent = 'Jardin dégagé en ' + s + ' s' + (rec ? ' — nouveau record' : ''); best();
      }
      render();
    }
    grid.addEventListener('click', function (e) {
      var b = e.target.closest('.mcell'); if (!b) return;
      if (lp) { lp = false; return; }
      act(+b.dataset.i, flagMode);
    });
    grid.addEventListener('contextmenu', function (e) { var b = e.target.closest('.mcell'); if (!b) return; e.preventDefault(); act(+b.dataset.i, true); });
    var lpT;
    grid.addEventListener('pointerdown', function (e) {
      var b = e.target.closest('.mcell'); if (!b || e.pointerType !== 'touch') return;
      lp = false; lpT = setTimeout(function () { lp = true; act(+b.dataset.i, true); }, 420);
    });
    function cancelLp() { clearTimeout(lpT); }
    grid.addEventListener('pointerup', cancelLp); grid.addEventListener('pointerleave', cancelLp); grid.addEventListener('pointercancel', cancelLp);
    seg.addEventListener('click', function (e) {
      var m = e.target.dataset && e.target.dataset.m; if (!m) return; flagMode = m === 'flag';
      Array.prototype.forEach.call(seg.children, function (x) { x.setAttribute('aria-pressed', x.dataset.m === m ? 'true' : 'false'); });
    });
    w.querySelector('.gbtn').addEventListener('click', reset);
    reset();
    return function () { stop(); clearTimeout(lpT); };
  }

  /* ---------- navigation ---------- */
  var DEFS = [
    { id: 'petals', name: 'Il m’aime… pas du tout', init: gPetals },
    { id: 'memory', name: 'Mémoire en fleurs', init: gMemory, rec: function (v) { return v ? v + ' coups' : ''; } },
    { id: 'ttt', name: 'Morpion roses et épines', init: gTicTac },
    { id: 'c4', name: 'Puissance 4 roses', init: gConnect },
    { id: 'mines', name: 'Champ d’épines', init: gMines, rec: function (v) { return v ? v + ' s' : ''; } },
    { id: 'simon', name: 'Simon des roses', init: gSimon, rec: function (v) { return v ? 'niveau ' + v : ''; } },
    { id: 'catch', name: 'Pluie de pétales', init: gCatch, rec: function (v) { return v ? v + ' pts' : ''; } },
    { id: 'snake', name: 'Serpent fleuri', init: gSnake, rec: function (v) { return v ? v + ' roses' : ''; } }
  ];
  function stop() { if (cur) { cur(); cur = null; } gbody.innerHTML = ''; }
  function showMenu() {
    stop(); gtitle.textContent = 'Jeux'; gback.textContent = '← Retour'; gback.onclick = close;
    var m = el('<div class="gmenu"></div>');
    DEFS.forEach(function (d) {
      var r = d.rec ? d.rec(store(d.id)) : '';
      var c = el('<button type="button" class="gcard"><span class="gn">' + roseIcon(PINK) + d.name + '</span><em>' + (r ? 'Record : ' + r : '') + '</em></button>');
      c.addEventListener('click', function () { play(d); });
      m.appendChild(c);
    });
    gbody.appendChild(m); games.scrollTop = 0;
  }
  function play(d) {
    stop(); gtitle.textContent = d.name; gback.textContent = '← Jeux'; gback.onclick = showMenu;
    cur = d.init(gbody) || null;
  }
  function open() { games.hidden = false; document.body.classList.add('in-games'); showMenu(); gback.focus(); }
  function close() { stop(); games.hidden = true; document.body.classList.remove('in-games'); var g = $('go'); if (g) g.focus(); }
  $('games-btn').addEventListener('click', open); $('header-games').addEventListener('click', open);
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !games.hidden) gback.click(); });
})();

</script>
</body>
